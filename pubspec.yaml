name: cairo_airport_web
description: "Cairo Airport Digital Twin — Web Command Center (frontend only, fixture-backed)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 17.5.0
  fl_chart: 1.3.1
  intl: 0.20.3
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
